<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f8b57"><title>Savers Club</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<section id="authView" class="auth"><div class="authbox"><div class="brand">SAVERS CLUB</div><h1>Save together.<br>Grow together.</h1><div class="card"><div class="tabs"><button id="loginTab" class="btn primary">Login</button><button id="signupTab" class="btn secondary">Create account</button></div><div id="authMsg"></div><form id="authForm" class="grid"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn primary" id="authSubmit">Login</button></form></div></div></section>
<div id="appView" class="hidden"><header class="topbar"><div class="inner"><div><div class="brand">SAVERS CLUB</div><div id="pageTitle" class="title">Dashboard</div></div><div class="userbox"><span id="userEmail" class="pill"></span><button id="logoutBtn" class="btn secondary">Logout</button></div></div></header><main class="wrap"><div id="groupGate" class="hidden"></div><div id="content"></div></main><nav class="nav"><div class="inner"><button data-page="dashboard" class="active">Home</button><button data-page="members">Members</button><button data-page="contributions">Contributions</button><button data-page="loans">Loans</button><button data-page="reports">Reports</button></div></nav></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">Form</h3><button id="closeModal" class="btn secondary">Close</button></div><div id="modalBody"></div></div></div>
<script src="app.js?v=4"></script></body></html>
