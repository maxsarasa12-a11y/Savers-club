<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f8b57" />
  <title>Savers Club MVP</title>
  <style>
:root {
  --bg: #f5f7f8;
  --card: #ffffff;
  --text: #162019;
  --muted: #6f7b74;
  --green: #0f8b57;
  --green-dark: #096b42;
  --green-soft: #e7f6ef;
  --red: #d94b4b;
  --amber: #d89411;
  --blue: #3c6fdd;
  --border: #dfe6e2;
  --shadow: 0 10px 30px rgba(20, 57, 39, .08);
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { min-height: 100vh; max-width: 760px; margin: 0 auto; background: var(--bg); }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(245,247,248,.94); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; border-bottom: 1px solid rgba(223,230,226,.7); }
.eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
h1 { font-size: 24px; line-height: 1.15; margin: 2px 0 0; }
h2 { margin: 0 0 12px; font-size: 18px; }
h3 { margin: 0; font-size: 16px; }
p { margin: 0; }
.icon-btn { width: 42px; height: 42px; border: 1px solid var(--border); background: var(--card); border-radius: 50%; box-shadow: var(--shadow); }
.content { padding: 14px 16px 104px; }
.bottom-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 30; width: min(760px,100%); display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: rgba(255,255,255,.96); backdrop-filter: blur(18px); }
.nav-item { border: 0; background: transparent; color: #69746d; padding: 6px 2px; border-radius: 12px; display: grid; justify-items: center; gap: 2px; }
.nav-item span { font-size: 20px; }
.nav-item small { font-size: 10px; font-weight: 700; }
.nav-item.active { color: var(--green); background: var(--green-soft); }
.hero { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; padding: 20px; border-radius: 24px; box-shadow: var(--shadow); }
.hero .label { opacity: .82; font-size: 13px; }
.hero .amount { font-size: 34px; font-weight: 900; margin-top: 6px; letter-spacing: -.02em; }
.hero .sub { margin-top: 10px; opacity: .9; font-size: 13px; }
.grid { display: grid; gap: 12px; }
.grid.metrics { grid-template-columns: repeat(2,minmax(0,1fr)); margin-top: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.metric .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
.metric .value { margin-top: 8px; font-size: 20px; font-weight: 850; }
.section { margin-top: 20px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.link-btn { border: 0; background: transparent; color: var(--green); font-weight: 800; padding: 5px; }
.activity, .list { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #edf1ef; }
.row:last-child { border-bottom: 0; }
.avatar { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: var(--green-dark); background: var(--green-soft); }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
.row-value { font-weight: 850; text-align: right; }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 800; }
.badge.green { color: #0a6d43; background: #e4f7ed; }
.badge.red { color: #a62f2f; background: #fdeaea; }
.badge.amber { color: #8b5b08; background: #fff2d3; }
.toolbar { display: flex; gap: 9px; margin-bottom: 12px; }
.search { flex: 1; border: 1px solid var(--border); background: #fff; border-radius: 13px; padding: 12px 13px; outline: none; }
.btn { border: 0; border-radius: 13px; padding: 12px 14px; font-weight: 850; }
.btn.primary { background: var(--green); color: #fff; }
.btn.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn.danger { background: #fff0f0; color: #a12d2d; border: 1px solid #ffd0d0; }
.btn.full { width: 100%; }
.form { display: grid; gap: 13px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 750; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #fff; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #8bcdb1; box-shadow: 0 0 0 3px rgba(15,139,87,.08); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.progress { height: 9px; background: #e7ece9; border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); border-radius: inherit; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; }
.kv span { color: var(--muted); font-size: 13px; }
.kv strong { font-size: 13px; }
.report-total { margin-top: 12px; padding: 14px; background: var(--green-soft); border-radius: 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
dialog { width: min(620px, calc(100% - 24px)); border: 0; border-radius: 22px; padding: 0; box-shadow: 0 24px 80px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,20,14,.45); backdrop-filter: blur(2px); }
.modal-inner { padding: 18px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.close-btn { border: 0; background: #eff3f1; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: 92px; z-index: 50; background: #142019; color: #fff; padding: 11px 15px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s ease; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.note { background: #fff9e9; color: #7a590e; border: 1px solid #f3dea8; border-radius: 13px; padding: 11px 12px; font-size: 12px; line-height: 1.45; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.tab { white-space: nowrap; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 11px; font-weight: 800; font-size: 12px; }
.tab.active { color: #fff; background: var(--green); border-color: var(--green); }
@media (min-width: 640px) {
  .content { padding-left: 22px; padding-right: 22px; }
  .grid.metrics { grid-template-columns: repeat(4,minmax(0,1fr)); }
}

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Savers Club</div>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <button class="icon-btn" id="reset-demo" title="Reset demo data" aria-label="Reset demo data">↻</button>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-route="dashboard" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="members" class="nav-item"><span>👥</span><small>Members</small></button>
      <button data-route="contributions" class="nav-item"><span>▣</span><small>Contributions</small></button>
      <button data-route="loans" class="nav-item"><span>💼</span><small>Loans</small></button>
      <button data-route="reports" class="nav-item"><span>☰</span><small>Reports</small></button>
    </nav>
  </div>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
const STORAGE_KEY = 'savacircle-mvp-v1';

const seedData = () => ({
  group: {
    name: 'Baggagga Kwagalana',
    cycle: 2026,
    currency: 'THB',
    minimumContribution: 3000,
    loanInterestRate: 5,
    monthlyPenaltyRate: 5,
    openingTreasury: 420000,
    expenses: 2000
  },
  members: [
    { id: 'm1', name: 'Daniel Opio', shares: 38000, guaranteeCapacity: 16000, penalties: 0 },
    { id: 'm2', name: 'Joy Mukasa', shares: 32000, guaranteeCapacity: 12000, penalties: 0 },
    { id: 'm3', name: 'John Nsubuga', shares: 28000, guaranteeCapacity: 10000, penalties: 250 },
    { id: 'm4', name: 'Junior Ntege', shares: 41000, guaranteeCapacity: 16000, penalties: 0 },
    { id: 'm5', name: 'Pius Ikiriza', shares: 30000, guaranteeCapacity: 6000, penalties: 0 },
    { id: 'm6', name: 'Ira Nakato', shares: 25000, guaranteeCapacity: 6000, penalties: 0 },
    { id: 'm7', name: 'Ingrid Wachira', shares: 25000, guaranteeCapacity: 6000, penalties: 0 },
    { id: 'm8', name: 'Faith Abura', shares: 27000, guaranteeCapacity: 8000, penalties: 0 },
    { id: 'm9', name: 'Emma Labejja', shares: 29000, guaranteeCapacity: 8000, penalties: 0 },
    { id: 'm10', name: 'Henry Ssemanda', shares: 26000, guaranteeCapacity: 7000, penalties: 0 },
    { id: 'm11', name: 'Juliet Nabayinda', shares: 31000, guaranteeCapacity: 9000, penalties: 0 }
  ],
  contributions: [
    { id:'c1', memberId:'m1', amount:5000, date:'2026-10-04', month:'2026-10', method:'Bank Transfer' },
    { id:'c2', memberId:'m2', amount:3000, date:'2026-10-04', month:'2026-10', method:'Bank Transfer' },
    { id:'c3', memberId:'m4', amount:3000, date:'2026-10-04', month:'2026-10', method:'Cash' },
    { id:'c4', memberId:'m6', amount:5000, date:'2026-10-04', month:'2026-10', method:'Bank Transfer' },
    { id:'c5', memberId:'m7', amount:3000, date:'2026-10-03', month:'2026-10', method:'Bank Transfer' },
    { id:'c6', memberId:'m8', amount:5000, date:'2026-10-03', month:'2026-10', method:'Bank Transfer' },
    { id:'c7', memberId:'m9', amount:3000, date:'2026-10-02', month:'2026-10', method:'Cash' },
    { id:'c8', memberId:'m10', amount:5000, date:'2026-10-02', month:'2026-10', method:'Bank Transfer' },
    { id:'c9', memberId:'m11', amount:3000, date:'2026-10-01', month:'2026-10', method:'Bank Transfer' }
  ],
  loans: [
    {
      id:'L015', borrowerId:'m2', principal:50000, interestRate:5, issuedDate:'2026-09-12', dueDate:'2026-12-12',
      guarantors:[
        { memberId:'m1', original:15000 },
        { memberId:'m4', original:15000 },
        { memberId:'m5', original:10000 },
        { memberId:'m6', original:5000 },
        { memberId:'m7', original:5000 }
      ],
      repayments:[{ id:'r1', amount:20000, date:'2026-10-04', method:'Bank Transfer' }]
    },
    {
      id:'L014', borrowerId:'m3', principal:30000, interestRate:5, issuedDate:'2026-10-01', dueDate:'2026-11-12',
      guarantors:[{memberId:'m8',original:15000},{memberId:'m9',original:15000}], repayments:[]
    }
  ],
  activity: [
    { text:'Daniel paid contribution', amount:5000, date:'4 Oct 2026, 10:24' },
    { text:'Joy loan repayment', amount:10000, date:'3 Oct 2026, 16:12' },
    { text:'Late penalty added to John', amount:250, date:'2 Oct 2026, 18:33' },
    { text:'Loan L014 issued to John', amount:30000, date:'1 Oct 2026, 14:08' }
  ]
});

let state = loadState();
let currentRoute = 'dashboard';

function loadState(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || seedData(); }
  catch { return seedData(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function money(n){ return `${state.group.currency} ${Number(n||0).toLocaleString()}`; }
function byId(id){ return state.members.find(m => m.id === id); }
function initials(name){ return name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }
function sum(arr, fn=x=>x){ return arr.reduce((a,x)=>a+Number(fn(x)||0),0); }
function loanInterest(loan){ return loan.principal * loan.interestRate / 100; }
function loanTotal(loan){ return loan.principal + loanInterest(loan); }
function repaid(loan){ return sum(loan.repayments, r=>r.amount); }
function outstanding(loan){ return Math.max(0, loanTotal(loan)-repaid(loan)); }
function principalOutstanding(loan){ return Math.max(0, loan.principal - Math.min(loan.principal, repaid(loan))); }
function activeLoans(){ return state.loans.filter(l=>outstanding(l)>0.009); }
function currentExposure(loan, guarantor){
  const ratio = loan.principal ? principalOutstanding(loan)/loan.principal : 0;
  return Math.round(guarantor.original * ratio);
}
function memberGuaranteed(memberId){
  return sum(activeLoans(), loan => sum(loan.guarantors.filter(g=>g.memberId===memberId), g=>currentExposure(loan,g)));
}
function totalSavings(){ return sum(state.members,m=>m.shares) + sum(state.contributions,c=>c.amount); }
function totalLoanOutstanding(){ return sum(activeLoans(), l=>outstanding(l)); }
function totalInterestEarned(){
  return sum(state.loans, l => Math.min(repaid(l), loanInterest(l)));
}
function totalPenalties(){ return sum(state.members,m=>m.penalties); }
function contributionsFor(month='2026-10'){ return state.contributions.filter(c=>c.month===month); }
function memberContributed(memberId, month='2026-10'){ return sum(contributionsFor(month).filter(c=>c.memberId===memberId),c=>c.amount); }
function nextId(prefix, list){ return prefix + (list.length + 1) + Date.now().toString().slice(-4); }

const app = document.querySelector('#app');
const modal = document.querySelector('#modal');
const toast = document.querySelector('#toast');
const title = document.querySelector('#page-title');

function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200); }
function openModal(html){ modal.innerHTML=`<div class="modal-inner">${html}</div>`; modal.showModal(); }
function closeModal(){ modal.close(); }
function route(name){ currentRoute=name; document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===name)); render(); }

function render(){
  const labels = {dashboard:'Dashboard',members:'Members',contributions:'Contributions',loans:'Loans & Guarantors',reports:'Reports'};
  title.textContent = labels[currentRoute] || 'Savers Club';
  if(currentRoute==='dashboard') renderDashboard();
  if(currentRoute==='members') renderMembers();
  if(currentRoute==='contributions') renderContributions();
  if(currentRoute==='loans') renderLoans();
  if(currentRoute==='reports') renderReports();
}

function renderDashboard(){
  app.innerHTML = `
    <section class="hero">
      <div class="label">${state.group.name} · ${state.group.cycle} Cycle</div>
      <div class="amount">${money(totalSavings())}</div>
      <div class="sub">Total group savings</div>
    </section>
    <section class="grid metrics">
      ${metric('Loans Outstanding',money(totalLoanOutstanding()),'💼')}
      ${metric('Interest Received',money(totalInterestEarned()),'🪙')}
      ${metric('Penalties',money(totalPenalties()),'⚠️')}
      ${metric('Members',state.members.length,'👥')}
    </section>
    <section class="section">
      <div class="section-head"><h2>Recent activity</h2><button class="link-btn" data-routejump="reports">View report</button></div>
      <div class="card activity">
        ${state.activity.map(a=>`<div class="row"><div class="avatar">✓</div><div class="row-main"><div class="row-title">${a.text}</div><div class="row-meta">${a.date}</div></div><div class="row-value">${money(a.amount)}</div></div>`).join('')}
      </div>
    </section>
    <section class="section">
      <div class="section-head"><h2>Quick actions</h2></div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <button class="btn primary" data-action="add-contribution">+ Contribution</button>
        <button class="btn secondary" data-action="add-loan">+ New loan</button>
      </div>
    </section>`;
}
function metric(label,value,icon){ return `<div class="card metric"><div class="top"><span>${label}</span><span>${icon}</span></div><div class="value">${value}</div></div>`; }

function renderMembers(filter=''){
  const q=filter.toLowerCase();
  const members=state.members.filter(m=>m.name.toLowerCase().includes(q));
  app.innerHTML=`
    <div class="toolbar"><input class="search" id="member-search" placeholder="Search members..." value="${filter}"><button class="btn primary" data-action="add-member">+ Add</button></div>
    <div class="card list">
      ${members.map(m=>{
        const guaranteed=memberGuaranteed(m.id), available=Math.max(0,m.guaranteeCapacity-guaranteed);
        return `<button class="row" style="width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left" data-member="${m.id}">
          <div class="avatar">${initials(m.name)}</div><div class="row-main"><div class="row-title">${m.name}</div><div class="row-meta">Shares: ${money(m.shares+sum(state.contributions.filter(c=>c.memberId===m.id),c=>c.amount))} · Guarantee available: ${money(available)}</div></div><span>›</span>
        </button>`;
      }).join('') || '<div class="empty">No members found.</div>'}
    </div>`;
  const input=document.querySelector('#member-search'); if(input) input.addEventListener('input',e=>renderMembers(e.target.value));
}

function showMember(id){
  const m=byId(id); if(!m) return;
  const guaranteed=memberGuaranteed(id), available=Math.max(0,m.guaranteeCapacity-guaranteed);
  const memberLoans=state.loans.filter(l=>l.borrowerId===id);
  openModal(`<div class="modal-head"><div><div class="eyebrow">Member profile</div><h2>${m.name}</h2></div><button class="close-btn" data-close>×</button></div>
    <div class="grid metrics">
      ${metric('Total Shares',money(m.shares+sum(state.contributions.filter(c=>c.memberId===id),c=>c.amount)),'▣')}
      ${metric('Guarantee Capacity',money(m.guaranteeCapacity),'🛡️')}
      ${metric('Currently Guaranteed',money(guaranteed),'🔗')}
      ${metric('Available',money(available),'✓')}
    </div>
    <div class="section card">
      <div class="kv"><span>Penalties</span><strong>${money(m.penalties)}</strong></div>
      <div class="kv"><span>Contributions recorded</span><strong>${state.contributions.filter(c=>c.memberId===id).length}</strong></div>
      <div class="kv"><span>Loans</span><strong>${memberLoans.length}</strong></div>
      <div class="kv"><span>Active loan outstanding</span><strong>${money(sum(memberLoans,l=>outstanding(l)))}</strong></div>
    </div>`);
}

function renderContributions(){
  const month='2026-10'; const list=contributionsFor(month); const completed=state.members.filter(m=>memberContributed(m.id,month)>=state.group.minimumContribution).length;
  const pct=Math.round(completed/state.members.length*100);
  app.innerHTML=`
    <div class="card"><div class="section-head"><div><h2>October 2026</h2><p class="row-meta">${completed} of ${state.members.length} members completed</p></div><button class="btn primary" data-action="add-contribution">+ Record</button></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row-meta" style="margin-top:8px">${pct}% complete</div></div>
    <div class="section card list">
      ${state.members.map(m=>{ const amt=memberContributed(m.id,month); const ok=amt>=state.group.minimumContribution; return `<div class="row"><div class="avatar">${initials(m.name)}</div><div class="row-main"><div class="row-title">${m.name}</div><div class="row-meta">${ok?'Completed':'Pending'} · Minimum ${money(state.group.minimumContribution)}</div></div><div class="row-value">${money(amt)}<div><span class="badge ${ok?'green':'amber'}">${ok?'✓ Paid':'Pending'}</span></div></div></div>`}).join('')}
    </div>`;
}

function contributionForm(){
  openModal(`<div class="modal-head"><div><div class="eyebrow">Contribution</div><h2>Record contribution</h2></div><button class="close-btn" data-close>×</button></div>
    <form id="contribution-form" class="form">
      <div class="field"><label>Member</label><select name="memberId" required>${state.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
      <div class="two-col"><div class="field"><label>Expected amount</label><input value="${state.group.minimumContribution}" disabled></div><div class="field"><label>Paid amount</label><input name="amount" type="number" min="1" value="${state.group.minimumContribution}" required></div></div>
      <div class="field"><label>Date</label><input name="date" type="date" value="2026-10-04" required></div>
      <div class="field"><label>Payment method</label><select name="method"><option>Bank Transfer</option><option>Cash</option><option>Mobile Money</option></select></div>
      <button class="btn primary full">Save contribution</button>
    </form>`);
}

function addMemberForm(){
  openModal(`<div class="modal-head"><div><div class="eyebrow">Membership</div><h2>Add member</h2></div><button class="close-btn" data-close>×</button></div>
    <form id="member-form" class="form"><div class="field"><label>Full name</label><input name="name" required placeholder="Member name"></div><div class="two-col"><div class="field"><label>Opening shares</label><input name="shares" type="number" min="0" value="0"></div><div class="field"><label>Guarantee capacity</label><input name="capacity" type="number" min="0" value="0"></div></div><button class="btn primary full">Add member</button></form>`);
}

function renderLoans(){
  app.innerHTML=`<div class="toolbar"><div class="search" style="display:flex;align-items:center">${activeLoans().length} active loans</div><button class="btn primary" data-action="add-loan">+ Loan</button></div>
    <div class="list">${state.loans.map(l=>{
      const borrower=byId(l.borrowerId), total=loanTotal(l), paid=repaid(l), out=outstanding(l), pct=Math.min(100,Math.round(paid/total*100));
      return `<button class="card" data-loan="${l.id}" style="width:100%;text-align:left"><div class="section-head"><div><h3>${l.id} · ${borrower?.name||'Unknown'}</h3><div class="row-meta">Due ${l.dueDate}</div></div><span class="badge ${out>0?'green':'amber'}">${out>0?'Active':'Closed'}</span></div><div class="kv"><span>Principal</span><strong>${money(l.principal)}</strong></div><div class="kv"><span>Total due</span><strong>${money(total)}</strong></div><div class="progress"><i style="width:${pct}%"></i></div><div class="kv"><span>Repaid ${pct}%</span><strong>${money(paid)}</strong></div><div class="kv"><span>Outstanding</span><strong>${money(out)}</strong></div></button>`;
    }).join('')}</div>`;
}

function loanForm(){
  openModal(`<div class="modal-head"><div><div class="eyebrow">Credit</div><h2>Create loan</h2></div><button class="close-btn" data-close>×</button></div>
    <form id="loan-form" class="form">
      <div class="field"><label>Borrower</label><select name="borrowerId">${state.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
      <div class="two-col"><div class="field"><label>Principal</label><input name="principal" type="number" min="1" value="30000" required></div><div class="field"><label>Interest rate %</label><input name="rate" type="number" min="0" value="${state.group.loanInterestRate}" required></div></div>
      <div class="field"><label>Due date</label><input name="dueDate" type="date" value="2026-12-12" required></div>
      <div class="note">After creating the loan, open it to assign guarantors. The MVP validates total guarantee amounts against the loan principal.</div>
      <button class="btn primary full">Create loan</button>
    </form>`);
}

function showLoan(id){
  const l=state.loans.find(x=>x.id===id); if(!l) return; const borrower=byId(l.borrowerId); const out=outstanding(l);
  openModal(`<div class="modal-head"><div><div class="eyebrow">Loan details</div><h2>${l.id} · ${borrower?.name}</h2></div><button class="close-btn" data-close>×</button></div>
    <div class="card"><div class="kv"><span>Principal</span><strong>${money(l.principal)}</strong></div><div class="kv"><span>Interest (${l.interestRate}%)</span><strong>${money(loanInterest(l))}</strong></div><div class="kv"><span>Total due</span><strong>${money(loanTotal(l))}</strong></div><div class="kv"><span>Repaid</span><strong>${money(repaid(l))}</strong></div><div class="report-total"><span>Outstanding</span><span>${money(out)}</span></div></div>
    <div class="section"><div class="section-head"><h2>Guarantors</h2><button class="btn secondary" data-add-guarantor="${l.id}">+ Add</button></div><div class="card list">
      ${l.guarantors.map(g=>{const m=byId(g.memberId), exp=currentExposure(l,g); return `<div class="row"><div class="avatar">${initials(m?.name||'?')}</div><div class="row-main"><div class="row-title">${m?.name}</div><div class="row-meta">Original ${money(g.original)}</div><div class="progress" style="margin-top:6px"><i style="width:${g.original?exp/g.original*100:0}%"></i></div></div><div class="row-value">${money(exp)}<div class="row-meta">exposed</div></div></div>`}).join('') || '<div class="empty">No guarantors assigned yet.</div>'}
    </div></div>
    <div class="section"><button class="btn primary full" data-repay="${l.id}" ${out<=0?'disabled':''}>Record repayment</button></div>`);
}

function addGuarantorForm(loanId){
  const l=state.loans.find(x=>x.id===loanId); if(!l) return;
  const already=new Set(l.guarantors.map(g=>g.memberId)); already.add(l.borrowerId);
  const options=state.members.filter(m=>!already.has(m.id));
  openModal(`<div class="modal-head"><div><div class="eyebrow">${loanId}</div><h2>Add guarantor</h2></div><button class="close-btn" data-close>×</button></div><form id="guarantor-form" class="form"><input type="hidden" name="loanId" value="${loanId}"><div class="field"><label>Member</label><select name="memberId">${options.map(m=>`<option value="${m.id}">${m.name} · available ${money(Math.max(0,m.guaranteeCapacity-memberGuaranteed(m.id)))}</option>`).join('')}</select></div><div class="field"><label>Guarantee amount</label><input name="amount" type="number" min="1" value="5000" required></div><button class="btn primary full">Add guarantor</button></form>`);
}

function repaymentForm(loanId){
  const l=state.loans.find(x=>x.id===loanId); if(!l) return;
  openModal(`<div class="modal-head"><div><div class="eyebrow">${loanId}</div><h2>Record repayment</h2></div><button class="close-btn" data-close>×</button></div><form id="repayment-form" class="form"><input type="hidden" name="loanId" value="${loanId}"><div class="field"><label>Outstanding</label><input value="${money(outstanding(l))}" disabled></div><div class="field"><label>Payment amount</label><input name="amount" type="number" min="1" max="${outstanding(l)}" value="${Math.min(10000,outstanding(l))}" required></div><div class="field"><label>Date</label><input name="date" type="date" value="2026-10-04" required></div><div class="field"><label>Method</label><select name="method"><option>Bank Transfer</option><option>Cash</option><option>Mobile Money</option></select></div><div class="note">Guarantor exposure is reduced automatically in proportion to principal repayment.</div><button class="btn primary full">Save repayment</button></form>`);
}

function renderReports(){
  const cont=sum(contributionsFor(),c=>c.amount); const repayments=sum(state.loans,l=>sum(l.repayments,r=>r.amount)); const interest=totalInterestEarned(); const penalties=totalPenalties(); const issued=sum(state.loans.filter(l=>l.issuedDate.startsWith('2026-10')),l=>l.principal); const closing=state.group.openingTreasury+cont+repayments+interest+penalties-issued-state.group.expenses;
  app.innerHTML=`<div class="tabs"><button class="tab active">October 2026</button><button class="tab">September</button><button class="tab">Cycle summary</button></div>
    <div class="section card"><div class="eyebrow">Financial summary</div><h2 style="margin-top:4px">${state.group.name}</h2><div class="row-meta">October 2026</div>
      <div class="kv"><span>Opening treasury</span><strong>${money(state.group.openingTreasury)}</strong></div>
      <div class="kv"><span>Contributions</span><strong>+ ${money(cont)}</strong></div>
      <div class="kv"><span>Loan repayments</span><strong>+ ${money(repayments)}</strong></div>
      <div class="kv"><span>Interest received</span><strong>+ ${money(interest)}</strong></div>
      <div class="kv"><span>Penalties</span><strong>+ ${money(penalties)}</strong></div>
      <div class="kv"><span>Loans issued</span><strong>- ${money(issued)}</strong></div>
      <div class="kv"><span>Expenses</span><strong>- ${money(state.group.expenses)}</strong></div>
      <div class="report-total"><span>Closing treasury</span><span>${money(closing)}</span></div>
    </div>
    <div class="section grid"><button class="btn primary" data-action="share-report">Share WhatsApp summary</button><button class="btn secondary" data-action="download-report">Download CSV report</button></div>`;
}

function reportText(){
  const cont=sum(contributionsFor(),c=>c.amount), repayments=sum(state.loans,l=>sum(l.repayments,r=>r.amount)), interest=totalInterestEarned(), penalties=totalPenalties(), issued=sum(state.loans.filter(l=>l.issuedDate.startsWith('2026-10')),l=>l.principal), closing=state.group.openingTreasury+cont+repayments+interest+penalties-issued-state.group.expenses;
  return `SAVERS CLUB – OCTOBER 2026\n${state.group.name}\n\nOpening Treasury: ${money(state.group.openingTreasury)}\nContributions: +${money(cont)}\nLoan Repayments: +${money(repayments)}\nInterest Received: +${money(interest)}\nPenalties: +${money(penalties)}\nLoans Issued: -${money(issued)}\nExpenses: -${money(state.group.expenses)}\n\nClosing Treasury: ${money(closing)}`;
}
function downloadCSV(){
  const rows=[['Member','Shares','October Contribution','Guarantee Capacity','Currently Guaranteed','Penalties'],...state.members.map(m=>[m.name,m.shares,memberContributed(m.id),m.guaranteeCapacity,memberGuaranteed(m.id),m.penalties])];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='savacircle-october-2026.csv'; a.click(); URL.revokeObjectURL(url);
}

document.addEventListener('click', async e=>{
  const nav=e.target.closest('[data-route]'); if(nav) return route(nav.dataset.route);
  const jump=e.target.closest('[data-routejump]'); if(jump) return route(jump.dataset.routejump);
  if(e.target.closest('[data-close]')) return closeModal();
  const action=e.target.closest('[data-action]')?.dataset.action;
  if(action==='add-contribution') return contributionForm();
  if(action==='add-member') return addMemberForm();
  if(action==='add-loan') return loanForm();
  if(action==='download-report') return downloadCSV();
  if(action==='share-report'){
    const text=reportText();
    if(navigator.share){ try { await navigator.share({title:'Savers Club October Report',text}); } catch {} }
    else { await navigator.clipboard?.writeText(text); showToast('Report copied to clipboard'); }
    return;
  }
  const member=e.target.closest('[data-member]'); if(member) return showMember(member.dataset.member);
  const loan=e.target.closest('[data-loan]'); if(loan) return showLoan(loan.dataset.loan);
  const addG=e.target.closest('[data-add-guarantor]'); if(addG) return addGuarantorForm(addG.dataset.addGuarantor);
  const repay=e.target.closest('[data-repay]'); if(repay) return repaymentForm(repay.dataset.repay);
});

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f=e.target; const d=Object.fromEntries(new FormData(f).entries());
  if(f.id==='contribution-form'){
    const amount=Number(d.amount); state.contributions.unshift({id:nextId('c',state.contributions),memberId:d.memberId,amount,date:d.date,month:d.date.slice(0,7),method:d.method});
    state.activity.unshift({text:`${byId(d.memberId).name} paid contribution`,amount,date:new Date(d.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})});
    saveState(); closeModal(); showToast('Contribution recorded'); render();
  }
  if(f.id==='member-form'){
    state.members.push({id:nextId('m',state.members),name:d.name.trim(),shares:Number(d.shares||0),guaranteeCapacity:Number(d.capacity||0),penalties:0}); saveState(); closeModal(); showToast('Member added'); render();
  }
  if(f.id==='loan-form'){
    const n=state.loans.length+14; state.loans.unshift({id:`L${String(n).padStart(3,'0')}`,borrowerId:d.borrowerId,principal:Number(d.principal),interestRate:Number(d.rate),issuedDate:'2026-10-04',dueDate:d.dueDate,guarantors:[],repayments:[]}); saveState(); closeModal(); showToast('Loan created — add guarantors'); render();
  }
  if(f.id==='guarantor-form'){
    const l=state.loans.find(x=>x.id===d.loanId), m=byId(d.memberId), amount=Number(d.amount); const available=Math.max(0,m.guaranteeCapacity-memberGuaranteed(m.id)); const totalGuaranteed=sum(l.guarantors,g=>g.original);
    if(amount>available){ showToast(`Only ${money(available)} guarantee capacity available`); return; }
    if(totalGuaranteed+amount>l.principal){ showToast(`Guarantees cannot exceed ${money(l.principal)}`); return; }
    l.guarantors.push({memberId:d.memberId,original:amount}); saveState(); showLoan(l.id); showToast('Guarantor added');
  }
  if(f.id==='repayment-form'){
    const l=state.loans.find(x=>x.id===d.loanId), amount=Number(d.amount); if(amount>outstanding(l)){ showToast('Payment exceeds outstanding balance'); return; }
    l.repayments.push({id:nextId('r',l.repayments),amount,date:d.date,method:d.method}); state.activity.unshift({text:`${byId(l.borrowerId).name} loan repayment`,amount,date:d.date}); saveState(); closeModal(); showToast('Repayment recorded'); render();
  }
});

document.querySelector('#reset-demo').addEventListener('click',()=>{
  if(confirm('Reset Savers Club to the original demo data?')){ state=seedData(); saveState(); showToast('Demo reset'); render(); }
});

modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
render();

  </script>
</body>
</html>
